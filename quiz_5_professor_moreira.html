<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quiz 5 — Professor Moreira</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eaf6ff;color:#10243e;font-family:Arial,sans-serif}
.app{max-width:780px;margin:auto;min-height:100vh;padding:14px 14px 96px}
.brand{background:#0b3b70;color:#fff;padding:14px;border-radius:18px;text-align:center;margin-bottom:12px}
.brand b{font-size:22px}.brand small{display:block;margin-top:4px}
.card{background:#fff;border-radius:20px;padding:18px;box-shadow:0 6px 22px #0002}
.meta{font-size:13px;font-weight:bold;color:#48657f;margin-bottom:10px}h2{font-size:23px;margin:4px 0 15px}
.qtext{font-size:19px;line-height:1.46;white-space:pre-wrap;margin-bottom:15px}
.alt{display:block;width:100%;text-align:left;border:2px solid #bdd7ea;background:#f8fcff;padding:13px;margin:9px 0;border-radius:14px;font-size:17px;line-height:1.35}
.alt.correct{background:#dff6e5;border-color:#219653}.alt.wrong{background:#ffe1e1;border-color:#d62828}.alt:disabled{color:#10243e;opacity:1}
.feedback{margin-top:15px;padding:14px;border-radius:14px;font-weight:bold}.ok{background:#dff6e5;color:#166534}.no{background:#ffe1e1;color:#9b1c1c}
.explain{font-size:17px;line-height:1.58;white-space:pre-wrap}.answer{font-size:21px;font-weight:bold;color:#166534;margin-bottom:12px}
.wrongbox{margin-top:14px;border-top:2px solid #dceaf5;padding-top:8px}.nav{position:fixed;left:0;right:0;bottom:0;background:#0b2545;padding:10px 8px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:8px}
.nav button{border:0;border-radius:12px;padding:11px 14px;font-weight:bold;font-size:15px}.count{color:white;align-self:center;min-width:70px;text-align:center}
.tip{margin-top:12px;color:#526b82;font-size:14px}
</style></head><body>
<div class="app"><div class="brand"><b>Curso de Contabilidade Professor Moreira</b><small>QUIZ 5 • 10 QUESTÕES • MOBILE</small></div><div id="root"></div></div>
<div class="nav"><button onclick="prev()">← Voltar</button><span class="count" id="count"></span><button onclick="next()">Avançar →</button><button onclick="restart()">↻ Reiniciar</button></div>
<script>
const Q=[{"n": 41, "banca": "FGV - Ana Leg (ALERO)/ALERO/Contabilidade/2026", "q": "Uma sociedade empresária vende máquinas de fotocópias para escritórios. Em 31/12/2025, não havia máquinas em estoque. Em janeiro de 2026, foram realizadas as seguintes compras: •05/01: 5 unidades por R$7.000, cada. •12/01: 3 unidades por R$7.200, cada. •18/01: 7 unidades por R$7.500, cada. Em 23/01 foram vendidas 8 máquinas por R$9.000, cada. Assinale a opção que indica o estoque final da sociedade empresária em 31/01/2026, considerando que ela utiliza o custo médio ponderado móvel para avaliar os seus estoques.", "alts": {"A": "R$50.633,33.", "B": "R$50.913,33.", "C": "R$52.500,00.", "D": "R$57.866,67.", "E": "R$58.186,67."}, "g": "B", "quizpos": 1, "exp": "Compras: 5×7.000=35.000; 3×7.200=21.600; 7×7.500=52.500. Total 15 unidades por R$109.100; média = R$7.273,33. Após vender 8, restam 7 unidades: 7×7.273,33 ≈ R$50.913,33."}, {"n": 42, "banca": "FGV - Ass Leg (ALERO)/ALERO/Técnico em Contabilidade/2026", "q": "Em 31/12/2025, uma entidade apresentava os seguintes saldos em seu Balanço Patrimonial: Disponibilidades: R$ 100.000; Capital Social: R$ 100.000. Em 05/01/2026, a entidade adquiriu 30 unidades da mercadoria X por R$ 600,00 à vista. Já em 10/01/2026, a entidade adquiriu 50 unidades de X por R$ 1.250, para pagamento em 120 dias. Em 15/01/2026, foram vendidas 20 unidades de X por R$ 1.000, à vista. O custo das mercadorias vendidas relacionadas a essa venda, considerando que a entidade utiliza o custo médio ponderado móvel para controle de estoque, foi de", "alts": {"A": "R$ 400,00.", "B": "R$ 450,00.", "C": "R$ 462,50.", "D": "R$ 493,33.", "E": "R$ 500,00."}, "g": "C", "quizpos": 2, "exp": "Após as duas compras: 30 unidades por R$600 total e 50 por R$1.250 total. Custo total R$1.850 para 80 unidades: média R$23,125. Venda de 20: CMV = 20×23,125 = R$462,50."}, {"n": 43, "banca": "FGV - Ass Leg (ALERO)/ALERO/Técnico em Contabilidade/2026", "q": "Uma entidade utiliza o método PEPS para mensurar o seu estoque. Além disso, renova o seu estoque semanalmente, com a compra de 100 unidades da mercadoria Y. Em 01/01/2026, não havia estoque de Y. No mês, os preços de aquisição unitários de Y foram os seguintes: •02/01: R$ 100 •09/01: R$ 110 •16/01: R$ 115 •23/01: R$ 123 •30/01: R$ 130 Em 31/01/2026, foi constatado que foram vendidas 400 unidades de Y. Assinale a opção que indica o estoque, no Balanço Patrimonial, em 31/01/2026.", "alts": {"A": "R$ 10.000.", "B": "R$ 11.000.", "C": "R$ 11.500.", "D": "R$ 12.300.", "E": "R$ 13.000."}, "g": "E", "quizpos": 3, "exp": "Foram compradas 500 unidades e vendidas 400. No PEPS, saem as 400 mais antigas; restam as 100 unidades da compra de 30/01, a R$130 cada. Estoque final = R$13.000."}, {"n": 44, "banca": "FGV - Bach (CFC)/CFC/1º Exame de Suficiência/2026", "q": "Uma loja de celulares utiliza o Custo Médio Ponderado móvel em base diária para valoração do estoque. Em julho de 2025, não havia estoque inicial do celular de modelo “XPTO”. No mês, houve a seguinte movimentação em relação a esse modelo de celular: 02/07: compra de 20 unidades por R$ 3.000,00 cada; 10/07: venda de 10 unidades por R$ 5.000,00 cada; 15/07: compra de 15 unidades por R$ 3.200,00 cada; 20/07: venda de 8 unidades por R$ 5.000,00 cada; 27/07: venda de 5 unidades por R$ 5.200,00 cada. O estoque de “XPTO” da loja, em 31/07/2025, era de", "alts": {"A": "R$ 36.988,00.", "B": "R$ 37.200,00.", "C": "R$ 37.440,00.", "D": "R$ 61.200,00."}, "g": "C", "quizpos": 4, "exp": "Compra 02/07: 20×3.000=60.000. Venda 10 deixa 10 por 3.000. Compra 15/07: 15×3.200=48.000; total 25 por R$78.000, média R$3.120. Vendas de 8 e 5 retiram 13×3.120; restam 12×3.120 = R$37.440."}, {"n": 45, "banca": "FGV - Ana Leg (ALERO)/ALERO/Contabilidade/2026", "q": "Em 01/05/2025, um acionista da Cia X recebeu um empréstimo de R$15.000 da própria entidade, com pagamento previsto para 01/03/2026. No Balanço Patrimonial, em 31/12/2025, a conta foi classificada como Ativo Circulante. Pode-se inferir que", "alts": {"A": "o acionista não é o sócio maioritário da Cia X.", "B": "o investimento do acionista na Cia X é recente.", "C": "o acionista também trabalha na Cia X, de modo regular.", "D": "o empréstimo representa negócio usual na exploração do objeto da Cia X.e)  os juros cobrados pelo empréstimo são menores do que os cobrados por outras entidades."}, "g": "D", "quizpos": 5, "exp": "Créditos com sócios/acionistas, em regra, têm tratamento próprio no não circulante, salvo quando decorrem de negócios usuais na exploração do objeto da companhia. Como o empréstimo foi classificado no circulante, a inferência compatível é que representa negócio usual da entidade."}, {"n": 46, "banca": "FGV - Ass Leg (ALERO)/ALERO/Técnico em Contabilidade/2026", "q": "Em 31/12/2025, uma entidade possuía, em caixa, R$ 2.000. Além disso, o saldo em sua conta corrente, no banco, era de R$ 3.000, enquanto as aplicações com vencimento em um ano eram de R$ 9.000. No Balanço Patrimonial, em 31/12/2025, o saldo apresentado pela entidade em “Disponibilidades” era de", "alts": {"A": "R$ 2.000.", "B": "R$ 3.000.", "C": "R$ 5.000.", "D": "R$ 11.000.", "E": "R$ 14.000."}, "g": "C", "quizpos": 6, "exp": "Disponibilidades incluem caixa e saldos bancários de livre movimentação: R$2.000 + R$3.000 = R$5.000. Aplicação com vencimento em um ano não é equivalente de caixa nas condições apresentadas."}, {"n": 47, "banca": "FGV - Per OC (PC PI)/PC PI/Perito Criminal/Contabilidade ou Economia/2026", "q": "Uma sociedade empresária realiza, apenas, vendas a prazo. Em 2024, ela reconheceu receita de vendas de R$600.000. As perdas estimadas com crédito de liquidação duvidosa eram de 4%. No entanto, diferente da expectativa, até 31/12/2024, 80% das vendas haviam sido recebidas. Na data, a sociedade empresária mudou a estimativa de inadimplência de clientes para 2%, em virtude do cenário econômico. Um perito contábil, ao analisar a situação, certificou a correta contabilização pela sociedade empresária do saldo líquido em Clientes, no Balanço Patrimonial, em 31/12/2024, de", "alts": {"A": "R$96.000.", "B": "R$108.000.", "C": "R$115.200.", "D": "R$117.600.", "E": "R$120.000."}, "g": "D", "quizpos": 7, "exp": "Vendas a prazo R$600.000; 80% recebidos = R$480.000; saldo bruto de Clientes = R$120.000. Nova estimativa de perda: 2% de R$120.000 = R$2.400. Saldo líquido = R$117.600."}, {"n": 48, "banca": "FGV - Ana Leg (ALEGO)/ALEGO/Analista de Controle Interno/Contabilidade/2026", "q": "Um escritório presta serviços de perícia contábil. Em 31/12/2025, ele apresentava saldo a receber de clientes no curto prazo, de R$ 200.000 e no longo prazo, de R$ 50.000. O escritório estima que a inadimplência dos clientes no curto prazo é de 2%, enquanto é de 6% no longo prazo. Assinale a opção que indica o saldo líquido total de Clientes em 31/12/2025, considerando o curto e o longo prazo:", "alts": {"A": "R$ 235.000.", "B": "R$ 240.000.", "C": "R$ 243.000.", "D": "R$ 245.000.", "E": "R$ 250.000."}, "g": "C", "quizpos": 8, "exp": "Curto prazo: R$200.000 − 2% = R$196.000. Longo prazo: R$50.000 − 6% = R$47.000. Saldo líquido total = R$243.000."}, {"n": 49, "banca": "FGV - Ass Leg (ALERO)/ALERO/Técnico em Contabilidade/2026", "q": "Em 10/06/2025, uma entidade vendeu três ativos que eram utilizados em seus negócios, do seguinte modo: •Impressora: venda por R$ 5.000, para recebimento em 05/06/2026; •Computador: venda por R$ 8.000, para recebimento em 02/03/2026; •Móvel: venda por R$ 10.000, para recebimento em 05/10/2026. O saldo em “Contas a Receber” no ativo circulante da entidade, no Balanço Patrimonial em 31/12/2025 foi de", "alts": {"A": "zero.", "B": "R$ 500.", "C": "R$ 5.000.", "D": "R$ 13.000.", "E": "R$ 23.000."}, "g": "E", "quizpos": 9, "exp": "Em 31/12/2025, todos os recebimentos vencem em 2026 e, portanto, dentro dos 12 meses seguintes: R$5.000 + R$8.000 + R$10.000 = R$23.000 no ativo circulante."}, {"n": 51, "banca": "FGV - Cons Leg (ALERO)/ALERO/Assessoramento em Orçamentos/2026", "q": "Em 01/01/2024, uma sociedade empresária que trabalha com consultoria tributária, adquiriu um terreno, que foi destinado a aluguel, por R$ 800.000. Na data, o imposto de transferência do terreno foi de R$ 16.000. O terreno foi inicialmente mensurado pelo custo. No entanto, em 31/12/2024, houve mudança de política contábil e o terreno foi mensurado pelo seu valor justo, de R$ 830.000. Em 31/12/2025, o valor justo do terreno foi estimado em R$ 840.000. A mudança no valor justo gerou, em 2025, um aumento no", "alts": {"A": "Resultado, de R$ 10.000.", "B": "Resultado, de R$ 24.000.", "C": "Resultado, de R$ 40.000.", "D": "Patrimônio Líquido, sem transitar pelo resultado, de R$ 10.000.", "E": "Patrimônio Líquido, sem transitar pelo resultado, de R$ 24.000."}, "g": "A", "quizpos": 10, "exp": "O terreno destinado a aluguel é propriedade para investimento. Pelo modelo do valor justo, variações posteriores são reconhecidas no resultado. De 31/12/2024 para 31/12/2025, o valor justo passou de R$830.000 para R$840.000: ganho de R$10.000 no resultado de 2025."}];let qi=0,side=0,answered=false,selected=null;
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){
 const x=Q[qi],root=document.getElementById('root');document.getElementById('count').textContent=(qi+1)+' / 10';
 if(side===0){
   const aa=Object.entries(x.alts).map(([k,v])=>`<button class="alt ${answered?(k===x.g?'correct':(k===selected?'wrong':'')):''}" ${answered?'disabled':''} onclick="choose('${k}')"><b>${k})</b> ${esc(v)}</button>`).join('');
   root.innerHTML=`<div class="card"><div class="meta">${esc(x.banca)} • Questão ${x.n}</div><h2>QUESTÃO ${x.quizpos} DO QUIZ</h2><div class="qtext">${esc(x.q)}</div>${aa}${answered?`<div class="feedback ${selected===x.g?'ok':'no'}">${selected===x.g?'✓ ACERTOU!':'✗ ERROU. Gabarito: '+x.g}<br>Avance para a resolução completa.</div>`:''}<div class="tip">Responda antes de avançar. A próxima tela traz a resolução comentada.</div></div>`;
 } else {
   const wrong=Object.entries(x.alts).filter(([k])=>k!==x.g).map(([k,v])=>`<p><b>${k}) ERRADA:</b> ${esc(v)}<br><span>${wrongReason(x,k)}</span></p>`).join('');
   root.innerHTML=`<div class="card"><div class="meta">${esc(x.banca)} • Questão ${x.n}</div><h2>RESOLUÇÃO COMENTADA</h2><div class="answer">✓ Gabarito: ${x.g}) ${esc(x.alts[x.g])}</div><div class="explain"><b>Comentário completo:</b><br>${esc(x.exp)}<div class="wrongbox"><b>POR QUE AS OUTRAS ESTÃO ERRADAS?</b>${wrong}</div></div></div>`;
 }window.scrollTo(0,0);
}
function wrongReason(x,k){return 'Esta alternativa não atende ao cálculo, à classificação ou ao conceito determinante explicado acima. Compare-a com a regra aplicada no comentário e com o gabarito '+x.g+'.';}
function choose(k){if(answered)return;selected=k;answered=true;render()}
function next(){if(side===0)side=1;else if(qi<Q.length-1){qi++;side=0;answered=false;selected=null}render()}
function prev(){if(side===1)side=0;else if(qi>0){qi--;side=1;answered=true;selected=Q[qi].g}render()}
function restart(){qi=0;side=0;answered=false;selected=null;render()}render();
</script></body></html>
